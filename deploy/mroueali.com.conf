# /etc/nginx/sites-available/mroueali.com
#
# HTTP only on purpose. Install this, verify the site loads on port 80, then run
#   sudo certbot --nginx -d mroueali.com -d www.mroueali.com
# and certbot rewrites this file in place: adds the 443 server block, the
# certificate paths, and a 301 from 80. Do not hand-write the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name mroueali.com www.mroueali.com;

    # The built frontend, copied here by deploy.sh. Deliberately not served out
    # of /home/ali: Ubuntu 24.04 creates home directories 750, so www-data
    # cannot traverse into one without loosening permissions on the whole home.
    root /var/www/mroueali.com;
    index index.html;

    # MAX_UPLOAD_MB=8 in backend/.env. This is the same limit with room for the
    # multipart envelope — nginx rejects first if it is lower, and its 413 is a
    # bare HTML page rather than the API's JSON error.
    client_max_body_size 12M;

    access_log /var/log/nginx/mroueali.access.log;
    error_log  /var/log/nginx/mroueali.error.log;

    # /admin is a client route, not a directory: main.tsx branches on the path
    # and lazy-imports the CMS. Any unknown path has to come back as index.html
    # or a refresh on /admin is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames — safe to cache hard. index.html must not be, or a
    # deploy leaves visitors on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ask/stream is server-sent events. With buffering on, nginx holds
        # the whole answer and hands the visitor a wall of text after 30s
        # instead of a sentence at a time.
        proxy_buffering off;
        proxy_cache off;

        # The ask bar makes two model calls, each bounded by AI_TIMEOUT=20. The
        # default 60s read timeout can cut a slow provider off mid-answer.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded images. Proxied rather than served from disk so the CSP and
    # nosniff headers that app/main.py attaches to everything under /media
    # survive — those are what keep an uploaded SVG from running scripts on
    # this origin.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nothing else on the backend is public: /docs, /health and / stay reachable
    # only from the server itself, over 127.0.0.1:8000.
}
